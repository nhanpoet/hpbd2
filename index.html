<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Letter Dear BON</title>
    <link rel="stylesheet" href="style.css" />
    <meta property="og:type" content="E-Greeting" />
    <!-- Thêm icon (favicon) -->
    <!-- <link rel="icon" href="favicon.ico" type="image/x-icon" /> -->
    <!-- Hoặc, nếu icon có định dạng PNG -->
    <link rel="icon" href="images/love_13698842.png" type="image/png" />

    <meta property="og:description" content="Wish you a very Happy Birthday" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <script
      src="https://code.jquery.com/jquery-3.7.1.min.js"
      integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <audio id="backgroundMusic" autoplay loop>
      <source src="tanca.mp3" type="audio/mpeg" />
      Your browser does not support the audio element.
    </audio>
    <div id="wrapper">
      <div class="flag__birthday">
        <img src="./images/1.png" alt="" width="350" class="flag__left" />
        <img src="./images/1.png" alt="" width="350" class="flag__right" />
      </div>
      <div class="content">
        <div class="left">
          <div class="title">
            <h1 class="happy">
              <span style="--t: 4s">D</span>
              <span style="--t: 4.2s">e</span>
              <span style="--t: 4.4s">a</span>
              <span style="--t: 4.6s">r</span>
              <!-- <span style="--t: 4.8s">y</span> -->
            </h1>
            <h1 class="birthday">
              <span style="--t: 5s">B</span>
              <span style="--t: 5.2s">o</span>
              <span style="--t: 5.4s">n</span>
              <span style="--t: 5.6s">B</span>
              <span style="--t: 5.8s">o</span>
              <span style="--t: 6s">n</span>
              <!-- <span style="--t: 6.2s">a</span>
              <span style="--t: 6.4s">y</span> -->
            </h1>
            <div class="hat">
              <img src="./images/hat.png" alt="" width="130" />
            </div>
          </div>
          <!-- <div class="date__of__birth">
            <span></span>
          </div> -->
          <div class="btn">
            <button id="btn__letter">
              Ấn vào đây nè Bonn
              <i class="fa-regular fa-envelope"></i>
            </button>
          </div>
        </div>
        <div class="right">
          <div class="box__account">
            <div class="image">
              <img src="./images/myphuong.jpg" alt="" />
            </div>
            <div class="name">
              <i class="fa-solid fa-heart"></i>
              <span style="color: wheat">Mỹ Phương</span>
              <i class="fa-solid fa-heart"></i>
            </div>
            <div class="balloon_one">
              <img width="100px" src="./images/balloon1.png" alt="" />
            </div>
            <div class="balloon_two">
              <img width="100px" src="./images/balloon2.png" alt="" />
            </div>
          </div>
          <div class="cricle">
            <div class="text__cricle">
              <span style="--i: 17">-</span>
              <span style="--i: 1">m</span>
              <span style="--i: 2">y</span>
              <span style="--i: 3">p</span>
              <span style="--i: 4">h</span>
              <span style="--i: 5">u</span>
              <span style="--i: 6">o</span>
              <span style="--i: 7">n</span>
              <span style="--i: 8">g</span>
              <span style="--i: 9">-</span>
              <span style="--i: 10">b</span>
              <span style="--i: 11">o</span>
              <span style="--i: 12">n</span>
              <span style="--i: 13">i</span>
              <span style="--i: 14">u</span>
              <!-- <span style="--i: 16">o</span>
              <span style="--i: 17">n</span>
              <span style="--i: 18">g</span> -->
              <span style="--i: 15">-</span>
            </div>
            <i class="fa-solid fa-heart"></i>
          </div>
        </div>
      </div>
      <div class="decorate_star star1" style="--t: 15s"></div>
      <div class="decorate_star star2" style="--t: 15.2s"></div>
      <div class="decorate_star star3" style="--t: 15.4s"></div>
      <div class="decorate_star star4" style="--t: 15.6s"></div>
      <div class="decorate_star star5" style="--t: 15.8s"></div>
      <div class="decorate_flower--one" style="--t: 15s">
        <img width="20" src="./images/decorate_flower.png" alt="" />
      </div>
      <div class="decorate_flower--two" style="--t: 15.3s">
        <img width="20" src="./images/decorate_flower.png" alt="" />
      </div>
      <div class="decorate_flower--three" style="--t: 15.6s">
        <img width="20" src="./images/decorate_flower.png" alt="" />
      </div>
      <div class="decorate_bottom">
        <img src="./images/decorate.png" alt="" width="100" />
      </div>
      <div class="smiley__icon">
        <img src="./images/smiley_icon.png" alt="" width="100" />
      </div>

      <div class="box__letter">
        <div class="letter__border">
          <div class="letter">
            <div class="title__letter"></div>
            <div class="content__letter">
              <div class="left">
                <img id="heart__letter" src="images/m2.png" alt="" />
                <img
                  class="heart heart_1"
                  style="--t: 0.2s"
                  width="20"
                  src="./images/heart.png"
                  alt=""
                />
                <img
                  class="heart heart_2"
                  style="--t: 0.4s"
                  width="20"
                  src="./images/heart.png"
                  alt=""
                />
                <img
                  class="heart heart_3"
                  style="--t: 0.6s"
                  width="20"
                  src="./images/heart.png"
                  alt=""
                />
                <img
                  class="heart heart_4"
                  style="--t: 0.8s"
                  width="20"
                  src="./images/heart.png"
                  alt=""
                />
              </div>
              <div class="right">
                <div class="love__img">
                  <img
                    src="https://media.giphy.com/media/m85llaN7ZkFIHtURiC/giphy.gif"
                    alt=""
                    width="220"
                  />
                </div>
                <div class="text__letter">
                  <p></p>
                </div>
                <img id="mewmew" width="80" src="./images/mewmew.gif" alt="" />
              </div>
            </div>
          </div>
          <div class="close">
            <i class="fa-solid fa-xmark"></i>
          </div>
        </div>
      </div>
    </div>
  </body>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      // Phát nhạc tự động khi trang được tải lên
      document.getElementById("backgroundMusic").play();

      // Kích hoạt sự kiện click của nút phát nhạc sau khi trang được tải
      document.getElementById("playButton").click();
    });
    let datetxt = "16-05-2002";
    let datatxtletter =
      "Hi Mỹ Phương. Em à, Anh biết là bây giờ Em đang rất đau lòng. Chia tay một người mà mình từng yêu thương không hề dễ dàng và không ai có thể hiểu hết cảm xúc của Em hơn cậu lúc này. Nhưng hãy nhớ rằng Em là một người tuyệt vời, xứng đáng được hạnh phúc và yêu thương. Anh sẽ lắng nghe bất cứ khi nào Em muốn chia sẻ !! Em không cần phải vội vàng quên đi, cứ từ từ vượt qua cảm giác này. Khi Em sẵn sàng, chúng ta sẽ cùng nhau làm điều gì đó khiến Em cảm thấy tốt hơn nhé 😊💖";
    let titleLetter = "Gửi Mỹ Phương";
    let charArrDate = datetxt.split("");
    let charArrDateLetter = datatxtletter.split("");
    let charArrTitle = titleLetter.split("");
    let currentIndex = 0;
    let currentIndexLetter = 0;
    let currentIndexTitle = 0;
    let date__of__birth = document.querySelector(".date__of__birth span");
    let text__letter = document.querySelector(".text__letter p");
    setTimeout(function () {
      timeDatetxt = setInterval(function () {
        if (currentIndex < charArrDate.length) {
          date__of__birth.textContent += charArrDate[currentIndex];
          currentIndex++;
        } else {
          let i = document.createElement("i");
          i.className = "fa-solid fa-star";
          document.querySelector(".date__of__birth").prepend(i);
          document
            .querySelector(".date__of__birth")
            .appendChild(i.cloneNode(true));
          clearInterval(timeDatetxt);
        }
      }, 100);
    }, 12000);

    var intervalContent;
    var intervalTitle;
    $("#btn__letter").on("click", function () {
      // Phát nhạc khi người dùng nhấp vào nút
      var audioElement = document.getElementById("backgroundMusic");
      var playPromise = audioElement.play();

      if (playPromise !== undefined) {
        playPromise
          .then((_) => {
            // Phát nhạc thành công
            console.log("Music is playing...");
          })
          .catch((error) => {
            // Xử lý lỗi phát nhạc
            console.log("Failed to play music: ", error);
          });
      }
    });
    $("#btn__letter").on("click", function () {
      $(".box__letter").slideDown();
      setTimeout(function () {
        $(".letter__border").slideDown();
      }, 1000);
      setTimeout(function () {
        intervalTitle = setInterval(function () {
          if (currentIndexTitle < charArrTitle.length) {
            document.querySelector(".title__letter").textContent +=
              charArrTitle[currentIndexTitle];
            let i = document.createElement("i");
            i.className = "fa-solid fa-heart";
            document.querySelector(".title__letter").appendChild(i);
            currentIndexTitle++;
          } else {
            clearInterval(intervalTitle);
          }
        }, 100);
      }, 2000);
      setTimeout(function () {
        document.querySelector("#heart__letter").classList.add("animationOp");
        document.querySelector(".love__img").classList.add("animationOp");
        document.querySelector("#mewmew").classList.add("animationOp");
      }, 2800);
      setTimeout(function () {
        document.querySelectorAll(".heart").forEach((item) => {
          item.classList.add("animation");
        });
      }, 3500);
      setTimeout(function () {
        intervalContent = setInterval(function () {
          if (currentIndexLetter < charArrDateLetter.length) {
            text__letter.textContent += charArrDateLetter[currentIndexLetter];
            currentIndexLetter++;
          } else {
            clearInterval(intervalContent);
          }
        }, 50);
      }, 6000);
    });
    $(".close").on("click", function () {
      clearInterval(intervalContent);
      document.querySelector(".title__letter").textContent = "";
      text__letter.textContent = "";
      currentIndexLetter = 0;
      currentIndexTitle = 0;
      document.querySelector("#heart__letter").classList.remove("animationOp");
      document.querySelector(".love__img").classList.remove("animationOp");
      document.querySelector("#mewmew").classList.remove("animationOp");
      document.querySelectorAll(".heart").forEach((item) => {
        item.classList.remove("animation");
      });

      $(".box__letter").slideUp();
      $(".letter__border").slideUp();
    });
  </script>
</html>
